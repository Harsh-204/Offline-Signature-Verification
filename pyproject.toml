[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigverify"
version = "0.1.0"
description = "Offline signature verification using classical feature engineering"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "opencv-python-headless>=4.8,<5",
    "scikit-image>=0.21,<1",
    "scikit-learn>=1.3,<2",
    "numpy>=1.24,<2",
    "scipy>=1.11,<2",
    "matplotlib>=3.7,<4",
    "joblib>=1.3,<2",
    "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[project.scripts]
sigverify = "sigverify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

